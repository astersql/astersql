[package]
name = "astersql-dumpling-export"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "dumpling/export"
legacy-tasks = []
kind = "library"
lane = 0

# arm64 darwin: no kv/domain/kvproto/grpcio.
# Prefer slim dumpling-log/cli/context only; local stubs cover SQL/MySQL/storage/HTTP/metrics.
[dependencies]
"astersql-dumpling-cli" = { package = "astersql-dumpling-cli", path = "../cli" }
"astersql-dumpling-context" = { package = "astersql-dumpling-context", path = "../context" }
"astersql-dumpling-log" = { package = "astersql-dumpling-log", path = "../log" }
"astersql-dumpformat-parquetfile" = { package = "astersql-dumpformat-parquetfile", path = "../../pkg/dumpformat/parquetfile" }
parquet = { git = "https://github.com/astersql/arrow-rs.git", tag = "astersql-parquet-v60.0.0-streaming-pages.1" }

"astersql-dumpformat-csvfile" = { path = "../../pkg/dumpformat/csvfile" }
"astersql-objstore-storeapi" = { path = "../../pkg/objstore/storeapi" }

toml = { version = "0.8.23", features = ["preserve_order"] }
"astersql-util-table-filter" = { path = "../../pkg/util/table-filter" }

astersql-dumpformat-sqlfile = { path = "../../pkg/dumpformat/sqlfile" }

schema-parser = { package = "astersql-parser", path = "../../pkg/parser" }
regex = "1"
schema-format = { package = "astersql-parser-format", path = "../../pkg/parser/format" }
schema-mysql = { package = "astersql-parser-mysql", path = "../../pkg/parser/mysql" }
