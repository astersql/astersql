[package]
name = "astersql-table-tblsession"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[features]
default = []
intest = []

[dependencies]
tblctx-dependency = { package = "astersql-table-tblctx", path = "../tblctx" }

[dev-dependencies]
chrono = "0.4"
