[package]
name = "astersql-expression-expropt"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "lib.rs"
doctest = false

[dependencies]
anyhow = "1"
chrono-tz = "0.10"
auth-crate = { package = "astersql-parser-auth", path = "../../parser/auth" }
exprctx-crate = { package = "astersql-expression-exprctx", path = "../exprctx" }
infoschema-crate = { package = "astersql-infoschema-context", path = "../../infoschema/context" }
intest-crate = { package = "astersql-util-intest", path = "../../util/intest", default-features = false }
mysql-crate = { package = "astersql-parser-mysql", path = "../../parser/mysql" }
variable-crate = { package = "astersql-sessionctx-variable", path = "../../sessionctx/variable" }

[package.metadata.porting]
go-package = "pkg/expression/expropt"
legacy-tasks = ["task-615", "task-619"]
