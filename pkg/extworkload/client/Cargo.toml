[package]
name = "astersql-extworkload-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1"
prost = "0.13"
thiserror = "2"
tonic = { version = "0.12", features = ["transport", "tls"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[package.metadata.porting]
go-package = "pkg/extworkload/client"
legacy-tasks = ["task-13", "task-116"]
