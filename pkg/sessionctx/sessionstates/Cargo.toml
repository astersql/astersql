[package]
name = "astersql-sessionctx-sessionstates"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[features]
# Match Go: Classic by default, NextGen only when explicitly selected.
default = []
nextgen = ["config/nextgen"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
config = { package = "astersql-config-deploymode", path = "../../config/deploymode" }
contextutil = { package = "astersql-util-context", path = "../../util/context" }
dbterror = { package = "astersql-util-dbterror", path = "../../util/dbterror" }
errno = { package = "astersql-errno", path = "../../errno" }
parser_types = { package = "astersql-parser-types", path = "../../parser/types" }
types = { package = "astersql-types", path = "../../types" }
model = { package = "astersql-meta-model", path = "../../meta/model" }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"

[package.metadata.porting]
go-package = "pkg/sessionctx/sessionstates"
legacy-tasks = ["task-446"]
