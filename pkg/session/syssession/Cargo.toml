[package]
name = "astersql-session-syssession"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "pkg/session/syssession"
legacy-tasks = ["task-794", "task-807", "task-1452", "task-1453"]

[target.'cfg(any())'.dependencies]
"astersql-domain-infosync" = { package = "astersql-domain-infosync", path = "../../domain/infosync" }
"astersql-kv" = { package = "astersql-kv", path = "../../kv" }
"astersql-parser-ast" = { package = "astersql-parser-ast", path = "../../parser/ast" }
"astersql-planner-core-resolve" = { package = "astersql-planner-core-resolve", path = "../../planner/core/resolve" }
"astersql-sessionctx" = { package = "astersql-sessionctx", path = "../../sessionctx" }
"astersql-util-chunk" = { package = "astersql-util-chunk", path = "../../util/chunk" }
"astersql-util-intest" = { package = "astersql-util-intest", path = "../../util/intest" }
"astersql-util-logutil" = { package = "astersql-util-logutil", path = "../../util/logutil" }
"astersql-util-sqlexec" = { package = "astersql-util-sqlexec", path = "../../util/sqlexec" }

[dev-dependencies]
"astersql-session-sessmgr" = { package = "astersql-session-sessmgr", path = "../sessmgr" }
"astersql-sessiontxn" = { package = "astersql-sessiontxn", path = "../../sessiontxn" }
"astersql-testkit" = { package = "astersql-testkit", path = "../../testkit" }
