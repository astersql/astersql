[package]
name = "astersql-privilege-privileges"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
astersql-util = { path = "../../util" }
hex = "0.4"
jsonwebtoken = "9"
sem = { package = "astersql-util-sem-compat", path = "../../util/sem/compat" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
openssl = "0.10"
serial_test = "3"
tempfile = "3"
vardef = { package = "astersql-sessionctx-vardef", path = "../../sessionctx/vardef" }
variable = { package = "astersql-sessionctx-variable", path = "../../sessionctx/variable" }

[package.metadata.porting]
go-package = "pkg/privilege/privileges"
