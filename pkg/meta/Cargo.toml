[package]
name = "astersql-meta"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
astersql-kv = { path = "../kv" }
astersql-util-codec = { path = "../util/codec" }
astersql-meta-model = { path = "model" }
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
