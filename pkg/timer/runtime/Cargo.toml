[package]
name = "astersql-timer-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
crossbeam-channel = "0.5"
fail = { version = "0.5", features = ["failpoints"] }
parking_lot = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
timer-api = { package = "astersql-timer-api", path = "../api" }

[package.metadata.porting]
go-package = "pkg/timer/runtime"
legacy-tasks = ["task-567", "task-579"]
