[package]
name = "astersql-parser-types"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
astersql-errors = { path = "../../errors" }
parser_charset = { package = "astersql-parser-charset", path = "../charset" }
format = { package = "astersql-parser-format", path = "../format" }
mysql = { package = "astersql-parser-mysql", path = "../mysql" }
terror = { package = "astersql-parser-terror", path = "../terror" }
util = { package = "astersql-parser-util", path = "../util" }
backtrace = "0.3"
log = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-general-category = "1"

[dev-dependencies]
serial_test = "3"

[package.metadata.porting]
go-package = "pkg/parser/types"
legacy-tasks = ["task-324", "task-362"]
