[package]
name = "astersql-server-err"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
astersql-errno = { path = "../../errno" }
astersql-errors = { path = "../../errors" }
astersql-parser-mysql = { path = "../../parser/mysql" }
astersql-parser-terror = { path = "../../parser/terror" }
astersql-util-dbterror = { path = "../../util/dbterror" }
backtrace = "0.3"
log = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
unicode-general-category = "1"

[package.metadata.porting]
go-package = "pkg/server/err"
legacy-tasks = ["task-282", "task-324"]
