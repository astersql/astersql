[package]
name = "astersql-infoschema-issyncer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "pkg/infoschema/issyncer"
legacy-tasks = ["task-920", "task-926"]

[dependencies]
metadef = { package = "astersql-meta-metadef", path = "../../meta/metadef" }

[target.'cfg(any())'.dependencies]
"astersql-config" = { package = "astersql-config", path = "../../config" }
"astersql-ddl-schemaver" = { package = "astersql-ddl-schemaver", path = "../../ddl/schemaver" }
"astersql-ddl-systable" = { package = "astersql-ddl-systable", path = "../../ddl/systable" }
"astersql-infoschema" = { package = "astersql-infoschema", path = ".." }
"astersql-infoschema-issyncer-mdldef" = { package = "astersql-infoschema-issyncer-mdldef", path = "mdldef" }
"astersql-infoschema-metrics" = { package = "astersql-infoschema-metrics", path = "../metrics" }
"astersql-infoschema-validatorapi" = { package = "astersql-infoschema-validatorapi", path = "../validatorapi" }
"astersql-kv" = { package = "astersql-kv", path = "../../kv" }
"astersql-meta" = { package = "astersql-meta", path = "../../meta" }
"astersql-meta-autoid" = { package = "astersql-meta-autoid", path = "../../meta/autoid" }
"astersql-meta-model" = { package = "astersql-meta-model", path = "../../meta/model" }
"astersql-metrics" = { package = "astersql-metrics", path = "../../metrics" }
"astersql-session-sessmgr" = { package = "astersql-session-sessmgr", path = "../../session/sessmgr" }
"astersql-sessionctx" = { package = "astersql-sessionctx", path = "../../sessionctx" }
"astersql-sessionctx-vardef" = { package = "astersql-sessionctx-vardef", path = "../../sessionctx/vardef" }
"astersql-store-helper" = { package = "astersql-store-helper", path = "../../store/helper" }
"astersql-util" = { package = "astersql-util", path = "../../util" }
"astersql-util-domainutil" = { package = "astersql-util-domainutil", path = "../../util/domainutil" }
"astersql-util-intest" = { package = "astersql-util-intest", path = "../../util/intest" }
"astersql-util-logutil" = { package = "astersql-util-logutil", path = "../../util/logutil" }
"astersql-util-mathutil" = { package = "astersql-util-mathutil", path = "../../util/mathutil" }
"astersql-util-sqlexec" = { package = "astersql-util-sqlexec", path = "../../util/sqlexec" }
"astersql-util-syncutil" = { package = "astersql-util-syncutil", path = "../../util/syncutil" }

[target.'cfg(any())'.dev-dependencies]
"astersql-parser-ast" = { package = "astersql-parser-ast", path = "../../parser/ast" }
"astersql-parser-mysql" = { package = "astersql-parser-mysql", path = "../../parser/mysql" }
"astersql-store-mockstore" = { package = "astersql-store-mockstore", path = "../../store/mockstore" }
