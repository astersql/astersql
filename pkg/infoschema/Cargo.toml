"astersql-store-helper" = { package = "astersql-store-helper", path = "../store/helper" }
"astersql-table-tables" = { package = "astersql-table-tables", path = "../table/tables" }
"astersql-types" = { package = "astersql-types", path = "../types" }
"astersql-util" = { package = "astersql-util", path = "../util" }
"astersql-util-chunk" = { package = "astersql-util-chunk", path = "../util/chunk" }
"astersql-util-collate" = { package = "astersql-util-collate", path = "../util/collate" }
