"astersql-domain-infosync" = { package = "astersql-domain-infosync", path = "../domain/infosync" }
"astersql-errno" = { package = "astersql-errno", path = "../errno" }
"astersql-infoschema-internal" = { package = "astersql-infoschema-internal", path = "internal" }
"astersql-kv" = { package = "astersql-kv", path = "../kv" }
"astersql-meta" = { package = "astersql-meta", path = "../meta" }
"astersql-meta-metadef" = { package = "astersql-meta-metadef", path = "../meta/metadef" }
"astersql-metrics" = { package = "astersql-metrics", path = "../metrics" }
"astersql-parser-auth" = { package = "astersql-parser-auth", path = "../parser/auth" }
"astersql-parser-charset" = { package = "astersql-parser-charset", path = "../parser/charset" }
"astersql-parser-mysql" = { package = "astersql-parser-mysql", path = "../parser/mysql" }
"astersql-parser-terror" = { package = "astersql-parser-terror", path = "../parser/terror" }
"astersql-privilege" = { package = "astersql-privilege", path = "../privilege" }
"astersql-session-txninfo" = { package = "astersql-session-txninfo", path = "../session/txninfo" }
