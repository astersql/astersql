[package]
name = "astersql-infoschema"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
"astersql-infoschema-context" = { package = "astersql-infoschema-context", path = "context" }
"astersql-infoschema-metrics" = { package = "astersql-infoschema-metrics", path = "metrics" }
"astersql-meta-autoid" = { package = "astersql-meta-autoid", path = "../meta/autoid" }
"astersql-meta-model" = { package = "astersql-meta-model", path = "../meta/model" }
"astersql-parser-ast" = { package = "astersql-parser-ast", path = "../parser/ast" }
"astersql-table" = { package = "astersql-table", path = "../table" }
"astersql-util-dbterror" = { package = "astersql-util-dbterror", path = "../util/dbterror" }
"astersql-util-size" = { package = "astersql-util-size", path = "../util/size" }
prometheus = "0.14"

[package.metadata.porting]
go-package = "pkg/infoschema"
legacy-tasks = ["task-864", "task-865", "task-866", "task-867", "task-868", "task-869", "task-871", "task-1393"]

[target.'cfg(any())'.dependencies]
"astersql-config" = { package = "astersql-config", path = "../config" }
"astersql-ddl-placement" = { package = "astersql-ddl-placement", path = "../ddl/placement" }
