"astersql-util-logutil" = { package = "astersql-util-logutil", path = "../util/logutil" }
"astersql-util-mock" = { package = "astersql-util-mock", path = "../util/mock" }
"astersql-util-sem-compat" = { package = "astersql-util-sem-compat", path = "../util/sem/compat" }
"astersql-util-set" = { package = "astersql-util-set", path = "../util/set" }
