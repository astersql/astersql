"astersql-store" = { package = "astersql-store", path = "../store" }
"astersql-store-driver" = { package = "astersql-store-driver", path = "../store/driver" }
"astersql-store-helper" = { package = "astersql-store-helper", path = "../store/helper" }
"astersql-store-mockstore" = { package = "astersql-store-mockstore", path = "../store/mockstore" }
"astersql-store-mockstore-mockstorage" = { package = "astersql-store-mockstore-mockstorage", path = "../store/mockstore/mockstorage" }
"astersql-store-mockstore-teststore" = { package = "astersql-store-mockstore-teststore", path = "../store/mockstore/teststore" }
"astersql-testkit-testenv" = { package = "astersql-testkit-testenv", path = "testenv" }
"astersql-types" = { package = "astersql-types", path = "../types" }
"astersql-util" = { package = "astersql-util", path = "../util" }
"astersql-util-breakpoint" = { package = "astersql-util-breakpoint", path = "../util/breakpoint" }
"astersql-util-chunk" = { package = "astersql-util-chunk", path = "../util/chunk" }
