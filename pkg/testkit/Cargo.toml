"astersql-util-sqlexec" = { package = "astersql-util-sqlexec", path = "../util/sqlexec" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
astersql-table-tables = { package = "astersql-table-tables", path = "../table/tables" }
