[package]
name = "astersql-testkit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "pkg/testkit"
legacy-tasks = ["task-1290", "task-1291", "task-1294", "task-1497"]

[dependencies]
"astersql-config" = { package = "astersql-config", path = "../config" }
"astersql-config-kerneltype" = { package = "astersql-config-kerneltype", path = "../config/kerneltype" }
"astersql-ddl" = { package = "astersql-ddl", path = "../ddl" }
"astersql-ddl-schematracker" = { package = "astersql-ddl-schematracker", path = "../ddl/schematracker" }
"astersql-domain" = { package = "astersql-domain", path = "../domain" }
"astersql-expression" = { package = "astersql-expression", path = "../expression" }
"astersql-infoschema-issyncer-mdldef" = { package = "astersql-infoschema-issyncer-mdldef", path = "../infoschema/issyncer/mdldef" }
"astersql-keyspace" = { package = "astersql-keyspace", path = "../keyspace" }
"astersql-kv" = { package = "astersql-kv", path = "../kv" }
"astersql-meta-model" = { package = "astersql-meta-model", path = "../meta/model" }
"astersql-parser-ast" = { package = "astersql-parser-ast", path = "../parser/ast" }
"astersql-parser-auth" = { package = "astersql-parser-auth", path = "../parser/auth" }
"astersql-parser-mysql" = { package = "astersql-parser-mysql", path = "../parser/mysql" }
"astersql-parser-terror" = { package = "astersql-parser-terror", path = "../parser/terror" }
"astersql-planner-core" = { package = "astersql-planner-core", path = "../planner/core" }
"astersql-planner-core-resolve" = { package = "astersql-planner-core-resolve", path = "../planner/core/resolve" }
"astersql-resourcemanager" = { package = "astersql-resourcemanager", path = "../resourcemanager" }
"astersql-session" = { package = "astersql-session", path = "../session" }
"astersql-session-sessionapi" = { package = "astersql-session-sessionapi", path = "../session/sessionapi" }
"astersql-session-sessmgr" = { package = "astersql-session-sessmgr", path = "../session/sessmgr" }
"astersql-session-txninfo" = { package = "astersql-session-txninfo", path = "../session/txninfo" }
"astersql-sessionctx-vardef" = { package = "astersql-sessionctx-vardef", path = "../sessionctx/vardef" }
"astersql-sessionctx-variable" = { package = "astersql-sessionctx-variable", path = "../sessionctx/variable" }
"astersql-statistics-handle" = { package = "astersql-statistics-handle", path = "../statistics/handle" }
