[package]
name = "astersql-errctx"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
astersql-errno = { path = "../errno" }
contextutil-crate = { package = "astersql-util-context", path = "../util/context" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
types_field = { package = "astersql-types-field", path = "../types/internal/field" }

[package.metadata.porting]
go-package = "pkg/errctx"
legacy-tasks = ["task-274", "task-324", "task-387"]
