[package]
name = "astersql-types-core-time"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
astersql-errors = { path = "../../../errors" }
backtrace = "0.3"
bigdecimal = "0.4"
chrono = "0.4"
chrono-tz = "0.10"
jiff = "0.2"
log = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-general-category = "1"
