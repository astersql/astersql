[package]
name = "astersql-types-time"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1.11"
rust_decimal = "1.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parser-mysql = { package = "astersql-parser-mysql", path = "../../../parser/mysql" }

[[test]]
name = "time_11_aster_unit_test"
path = "../../time_11_aster_unit_test.rs"
