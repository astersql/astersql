[package]
name = "astersql-domain-infosync"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
tikv-client = { version = "=0.4.2", git = "ssh://git@github.com/astersql/client-rust.git", tag = "v0.4.2-aster.10", default-features = false }
astersql-config = { path = "../../config" }
ddl-label = { package = "astersql-ddl-label", path = "../../ddl/label" }
ddl-placement = { package = "astersql-ddl-placement", path = "../../ddl/placement" }
meta-model = { package = "astersql-meta-model", path = "../../meta/model" }
store-helper = { package = "astersql-store-helper", path = "../../store/helper" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[package.metadata.porting]
go-package = "pkg/domain/infosync"
