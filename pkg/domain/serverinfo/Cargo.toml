[package]
name = "astersql-domain-serverinfo"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "pkg/domain/serverinfo"
legacy-tasks = ["task-761", "task-773"]

[dependencies]
astersql-util-logutil = { path = "../../util/logutil" }
base64 = "0.22"
astersql-config = { path = "../../config" }
etcd-client = { version = "0.19", features = ["tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
