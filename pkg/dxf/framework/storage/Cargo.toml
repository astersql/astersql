[package]
name = "astersql-dxf-framework-storage"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "lib.rs"
doctest = false

[[test]]
name = "converter_1_aster_unit_test"
path = "converter_1_aster_unit_test.rs"

[[test]]
name = "task_table_2_aster_unit_test"
path = "task_table_2_aster_unit_test.rs"

[features]
nextgen = ["astersql-config-kerneltype/nextgen"]

[dependencies]
astersql-config = { path = "../../../config" }
astersql-config-kerneltype = { path = "../../../config/kerneltype" }
parking_lot = "0.12"
proto-crate = { package = "astersql-dxf-framework-proto", path = "../proto" }
schstatus-crate = { package = "astersql-dxf-framework-schstatus", path = "../schstatus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.porting]
go-package = "pkg/dxf/framework/storage"
legacy-tasks = ["task-637", "task-638", "task-640", "task-1563", "task-1564"]
