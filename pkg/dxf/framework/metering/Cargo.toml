[package]
name = "astersql-dxf-framework-metering"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"
doctest = false

[features]
# Match Go's opt-in nextgen build tag.
default = []
nextgen = ["kerneltype/nextgen"]

[dependencies]
anyhow = "1"
bytesize = "2"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
dxfmetric = { package = "astersql-dxf-framework-dxfmetric", path = "../dxfmetric" }
kerneltype = { package = "astersql-config-kerneltype", path = "../../../config/kerneltype", default-features = false }
proto = { package = "astersql-dxf-framework-proto", path = "../proto" }
recording = { package = "astersql-objstore-recording", path = "../../../objstore/recording" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[package.metadata.porting]
go-package = "pkg/dxf/framework/metering"
legacy-tasks = ["task-524"]
