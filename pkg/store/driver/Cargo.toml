[package]
name = "astersql-store-driver"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
astersql-ingestor-ingestcli = { path = "../../ingestor/ingestcli" }
astersql-metaservice = { path = "../../metaservice" }
astersql-config = { path = "../../config" }
astersql-config-configtypes = { path = "../../config/configtypes" }
astersql-testkit-testfailpoint = { path = "../../testkit/testfailpoint" }
astersql-kv = { package = "astersql-kv", path = "../../kv" }
astersql-store-copr = { package = "astersql-store-copr", path = "../copr" }
astersql-store-driver-txn = { package = "astersql-store-driver-txn", path = "txn" }
thiserror = "2"
tikv-client = { version = "=0.4.2", git = "ssh://git@github.com/astersql/client-rust.git", tag = "v0.4.2-aster.13", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"
tonic = { version = "0.12", features = ["tls"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde_json = "1"
"astersql-util-codec" = { package = "astersql-util-codec", path = "../../util/codec" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
protobuf = "=2.8.0"
tipb = { git = "https://github.com/pingcap/tipb.git", rev = "59b678398b175538bba2599a1aefd3b4ecb1fd3d", default-features = false, features = ["protobuf-codec"] }

[package.metadata.porting]
go-package = "pkg/store/driver"
