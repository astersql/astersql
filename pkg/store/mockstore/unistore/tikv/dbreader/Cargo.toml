[package]
name = "astersql-store-mockstore-unistore-tikv-dbreader"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
anyhow = "1"
fjall = "=3.1.6"
grpcio = { version = "=0.13.0", default-features = false, features = ["protobuf-codec"] }
kvproto = { git = "https://github.com/astersql/kvproto.git", tag = "v0.0.2-aster.20260929", default-features = false, features = ["protobuf-codec"] }
kverrors-crate = { package = "astersql-store-mockstore-unistore-tikv-kverrors", path = "../kverrors" }
mvcc-crate = { package = "astersql-store-mockstore-unistore-tikv-mvcc", path = "../mvcc" }

[dev-dependencies]
tempfile = "3"

[package.metadata.porting]
go-package = "pkg/store/mockstore/unistore/tikv/dbreader"
legacy-tasks = ["task-483"]
