[package]
name = "astersql-store-mockstore-unistore"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "pkg/store/mockstore/unistore"
legacy-tasks = ["task-845", "task-849", "task-850"]

[dependencies]
astersql-util = { path = "../../../util" }
"astersql-store-mockstore-unistore-config" = { package = "astersql-store-mockstore-unistore-config", path = "config" }
"astersql-store-mockstore-unistore-server" = { package = "astersql-store-mockstore-unistore-server", path = "server" }
"astersql-store-mockstore-unistore-tikv" = { package = "astersql-store-mockstore-unistore-tikv", path = "tikv" }
fail = { version = "0.5.1", features = ["failpoints"] }

[dev-dependencies]
"astersql-testkit-testsetup" = { package = "astersql-testkit-testsetup", path = "../../../testkit/testsetup" }
