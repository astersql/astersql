[package]
name = "astersql-store-mockstore-mockstorage"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "pkg/store/mockstore/mockstorage"
legacy-tasks = ["task-819"]

[dependencies]
tikv-client = { version = "=0.4.2", git = "ssh://git@github.com/astersql/client-rust.git", tag = "v0.4.2-aster.16", default-features = false }
astersql-ingestor-ingestcli = { path = "../../../ingestor/ingestcli" }
fs2 = "0.4"
serde_json = "1"
astersql-store-mockstore-unistore = { path = "../unistore" }
"astersql-kv" = { package = "astersql-kv", path = "../../../kv" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(any())'.dependencies]
"astersql-store-copr" = { package = "astersql-store-copr", path = "../../copr" }
"astersql-store-driver-txn" = { package = "astersql-store-driver-txn", path = "../../driver/txn" }
"astersql-store-helper" = { package = "astersql-store-helper", path = "../../helper" }
