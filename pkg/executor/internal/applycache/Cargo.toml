edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
kvcache-dependency = { package = "astersql-util-kvcache", path = "../../../util/kvcache" }
parking_lot = "0.12"
tidb-chunk = { package = "astersql-util-chunk", path = "../../../util/chunk" }
tidb-memory = { package = "astersql-util-memory", path = "../../../util/memory" }

[dev-dependencies]
fail = { version = "0.5.1", features = ["failpoints"] }
