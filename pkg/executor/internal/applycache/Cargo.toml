tidb_autoid = { package = "astersql-meta-autoid", path = "../../../meta/autoid" }
tidb_config = { package = "astersql-config", path = "../../../config" }

[package.metadata.porting]
go-package = "pkg/executor/internal/applycache"
legacy-tasks = ["task-628"]
