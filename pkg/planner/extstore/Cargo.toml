[package]
name = "astersql-planner-extstore"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"
doctest = false

[features]
default = []
nextgen = ["kerneltype/nextgen"]

[dependencies]
anyhow = "1"
chrono = "0.4"
config = { package = "astersql-config", path = "../../config" }
kerneltype = { package = "astersql-config-kerneltype", path = "../../config/kerneltype" }
log = "0.4"
objstore = { package = "astersql-objstore", path = "../../objstore" }
path-clean = "1"
url = "2"
vardef = { package = "astersql-sessionctx-vardef", path = "../../sessionctx/vardef" }

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[package.metadata.porting]
go-package = "pkg/planner/extstore"
legacy-tasks = ["task-657"]
