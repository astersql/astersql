[package]
name = "astersql-lightning-config"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "pkg/lightning/config"
legacy-tasks = ["task-910", "task-917"]

[dependencies]
"astersql-util-cpu" = { package = "astersql-util-cpu", path = "../../util/cpu" }
fail = { version = "0.5.1", features = ["failpoints"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"

[dev-dependencies]
regex = "1"
