[package]
name = "astersql-bindinfo"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "lib.rs"
doctest = false

[dependencies]
astersql-parser = { path = "../parser" }
astersql-util-hint = { path = "../util/hint" }
astersql-util-parser = { path = "../util/parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.porting]
go-package = "pkg/bindinfo"
