[package]
name = "astersql-ddl-notifier"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
ddl-session = { package = "astersql-ddl-session", path = "../session" }
meta-model = { package = "astersql-meta-model", path = "../../meta/model" }
parser-ast = { package = "astersql-parser-ast", path = "../../parser/ast" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[package.metadata.porting]
go-package = "pkg/ddl/notifier"
legacy-tasks = ["task-912", "task-915", "task-1301"]
