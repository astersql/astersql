[package]
name = "astersql-ddl-schemaver"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "pkg/ddl/schemaver"
legacy-tasks = ["task-816", "task-830"]

[dependencies]
etcd-client = { version = "0.19", features = ["tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
"astersql-domain-serverinfo" = { package = "astersql-domain-serverinfo", path = "../../domain/serverinfo" }

[target.'cfg(any())'.dependencies]
"astersql-config-kerneltype" = { package = "astersql-config-kerneltype", path = "../../config/kerneltype" }
"astersql-ddl-logutil" = { package = "astersql-ddl-logutil", path = "../logutil" }
"astersql-ddl-util" = { package = "astersql-ddl-util", path = "../util" }
"astersql-metrics" = { package = "astersql-metrics", path = "../../metrics" }
"astersql-sessionctx-vardef" = { package = "astersql-sessionctx-vardef", path = "../../sessionctx/vardef" }
"astersql-util" = { package = "astersql-util", path = "../../util" }
"astersql-util-disttask" = { package = "astersql-util-disttask", path = "../../util/disttask" }
"astersql-util-etcd" = { package = "astersql-util-etcd", path = "../../util/etcd" }

[target.'cfg(any())'.dev-dependencies]
"astersql-keyspace" = { package = "astersql-keyspace", path = "../../keyspace" }
"astersql-parser-terror" = { package = "astersql-parser-terror", path = "../../parser/terror" }
"astersql-testkit-testfailpoint" = { package = "astersql-testkit-testfailpoint", path = "../../testkit/testfailpoint" }
