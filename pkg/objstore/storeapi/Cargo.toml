[package]
name = "astersql-objstore-storeapi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
anyhow = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
objectio = { package = "astersql-objstore-objectio", path = "../objectio" }
uuid = { version = "1", features = ["v4"] }

[package.metadata.porting]
go-package = "pkg/objstore/storeapi"
legacy-tasks = ["task-234"]
