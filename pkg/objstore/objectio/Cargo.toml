[package]
name = "astersql-objstore-objectio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
astersql-objstore-compressedio = { path = "../compressedio" }
astersql-objstore-recording = { path = "../recording" }
http = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
anyhow = "1"
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
flate2 = "1"
futures = "0.3"
hostname = "0.4"
libc = "0.2"
object-store = { package = "object_store", version = "0.14", features = ["azure", "gcp"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snap = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zstd = "0.13"

[package.metadata.porting]
go-package = "pkg/objstore/objectio"
legacy-tasks = ["task-171", "task-234"]
