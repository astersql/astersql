[package]
name = "astersql-autoid_service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "pkg/autoid_service"
legacy-tasks = ["task-586", "task-1295"]

[dependencies]
"astersql-config" = { package = "astersql-config", path = "../config" }
"astersql-config-kerneltype" = { package = "astersql-config-kerneltype", path = "../config/kerneltype" }
"astersql-keyspace" = { package = "astersql-keyspace", path = "../keyspace" }
"astersql-kv" = { package = "astersql-kv", path = "../kv" }
"astersql-meta" = { package = "astersql-meta", path = "../meta" }
autoid_dependency = { package = "astersql-meta-autoid", path = "../meta/autoid" }
"astersql-meta-model" = { package = "astersql-meta-model", path = "../meta/model" }
"astersql-metrics" = { package = "astersql-metrics", path = "../metrics" }
owner_dependency = { package = "astersql-owner", path = "../owner" }
"astersql-util-etcd" = { package = "astersql-util-etcd", path = "../util/etcd" }
"astersql-util-logutil" = { package = "astersql-util-logutil", path = "../util/logutil" }
etcd-client = "0.19"
fail = { version = "0.5", features = ["failpoints"] }
grpcio = { version = "0.13", default-features = false, features = ["protobuf-codec"] }
kvproto = { git = "https://github.com/astersql/kvproto.git", tag = "v0.0.2-aster.20260929", default-features = false, features = ["protobuf-codec"] }
log = "0.4"
metrics = "0.24"
thiserror = "2"
tokio-util = "0.7"
