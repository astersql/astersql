[package]
name = "astersql-ttl-cache"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "pkg/ttl/cache"
legacy-tasks = ["task-913", "task-916", "task-1499", "task-1500"]

[target.'cfg(target_os = "windows")'.dependencies]
"astersql-expression" = { package = "astersql-expression", path = "../../expression" }
"astersql-expression-exprstatic" = { package = "astersql-expression-exprstatic", path = "../../expression/exprstatic" }
"astersql-infoschema" = { package = "astersql-infoschema", path = "../../infoschema" }
"astersql-infoschema-context" = { package = "astersql-infoschema-context", path = "../../infoschema/context" }
"astersql-kv" = { package = "astersql-kv", path = "../../kv" }
"astersql-meta-model" = { package = "astersql-meta-model", path = "../../meta/model" }
"astersql-parser-ast" = { package = "astersql-parser-ast", path = "../../parser/ast" }
"astersql-parser-charset" = { package = "astersql-parser-charset", path = "../../parser/charset" }
"astersql-parser-mysql" = { package = "astersql-parser-mysql", path = "../../parser/mysql" }
"astersql-parser-terror" = { package = "astersql-parser-terror", path = "../../parser/terror" }
"astersql-table-tables" = { package = "astersql-table-tables", path = "../../table/tables" }
"astersql-tablecodec" = { package = "astersql-tablecodec", path = "../../tablecodec" }
"astersql-ttl-session" = { package = "astersql-ttl-session", path = "../session" }
"astersql-types" = { package = "astersql-types", path = "../../types" }
"astersql-util-chunk" = { package = "astersql-util-chunk", path = "../../util/chunk" }
"astersql-util-codec" = { package = "astersql-util-codec", path = "../../util/codec" }
"astersql-util-collate" = { package = "astersql-util-collate", path = "../../util/collate" }
"astersql-util-intest" = { package = "astersql-util-intest", path = "../../util/intest" }
"astersql-util-logutil" = { package = "astersql-util-logutil", path = "../../util/logutil" }

[target.'cfg(target_os = "windows")'.dev-dependencies]
"astersql-server" = { package = "astersql-server", path = "../../server" }
"astersql-session" = { package = "astersql-session", path = "../../session" }
"astersql-store-helper" = { package = "astersql-store-helper", path = "../../store/helper" }
"astersql-testkit" = { package = "astersql-testkit", path = "../../testkit" }
"astersql-testkit-testflag" = { package = "astersql-testkit-testflag", path = "../../testkit/testflag" }
"astersql-testkit-testsetup" = { package = "astersql-testkit-testsetup", path = "../../testkit/testsetup" }
