[package]
name = "astersql-inference"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time"] }
regex = "1"
logutil = { package = "astersql-util-logutil", path = "../util/logutil" }

[package.metadata.porting]
go-package = "pkg/inference"
