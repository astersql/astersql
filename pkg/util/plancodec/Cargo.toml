[package]
name = "astersql-util-plancodec"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
base64 = "0.22"
log = "0.4"
protobuf = { git = "https://github.com/pingcap/rust-protobuf", rev = "82b49fea7e696fd647b5aca0a6c6ec944eab3189" }
snap = "1"
texttree-dependency = { package = "astersql-util-texttree", path = "../texttree" }
thiserror = "2"

[build-dependencies]
protobuf-codegen-pure = { git = "https://github.com/pingcap/rust-protobuf", rev = "82b49fea7e696fd647b5aca0a6c6ec944eab3189" }

[package.metadata.porting]
go-package = "pkg/util/plancodec"
legacy-tasks = ["task-470", "task-486"]
