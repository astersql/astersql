[package]
name = "astersql-util-topsql-reporter"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"
autotests = false

[lib]
path = "lib.rs"
doctest = false

[features]
failpoints = []

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
futures-util = "0.3"
log = "0.4"
prost = "0.13"
protobuf = "=2.8.0"
reporter_metrics = { package = "astersql-util-topsql-reporter-metrics", path = "metrics" }
thiserror = "2"
tipb = { git = "https://github.com/pingcap/tipb.git", rev = "07f0ea6b6bffa9d8ac100d81ee51dbbfe4dda3bf", default-features = false, features = ["protobuf-codec"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["transport"] }
topsql_collector = { package = "astersql-util-topsql-collector", path = "../collector" }
topsql_parser = { package = "astersql-parser", path = "../../../parser" }
topsql_protocol = { package = "astersql-util-topsql-reporter-mock", path = "mock" }
topsql_state = { package = "astersql-util-topsql-state", path = "../state" }
topsql_stmtstats = { package = "astersql-util-topsql-stmtstats", path = "../stmtstats" }

[dev-dependencies]
serial_test = "3"

[package.metadata.porting]
go-package = "pkg/util/topsql/reporter"
legacy-tasks = ["task-589", "task-590"]
