[package]
name = "astersql-util-sys-linux"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
nix = { version = "0.31", features = ["socket"] }

[package.metadata.porting]
go-package = "pkg/util/sys/linux"
legacy-tasks = ["task-94", "task-157"]

[dev-dependencies]
astersql-testkit-testsetup = { path = "../../../testkit/testsetup" }
