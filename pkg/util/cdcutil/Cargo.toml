[package]
name = "astersql-util-cdcutil"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
log = "0.4"
path-clean = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[package.metadata.porting]
go-package = "pkg/util/cdcutil"
legacy-tasks = ["task-61", "task-135"]
