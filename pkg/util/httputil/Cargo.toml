[package]
name = "astersql-util-httputil"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tiny_http = "0.12"

[package.metadata.porting]
go-package = "pkg/util/httputil"
legacy-tasks = ["task-75", "task-145"]
