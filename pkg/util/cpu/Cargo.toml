[package]
name = "astersql-util-cpu"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[features]
default = ["failpoints"]
failpoints = ["fail/failpoints"]
test-support = []

[dependencies]
anyhow = "1"
cgroup_crate = { package = "astersql-util-cgroup", path = "../cgroup" }
fail = "0.5.1"
libc = "0.2"
log = "0.4"
mathutil_crate = { package = "astersql-util-mathutil", path = "../mathutil" }
prometheus = "0.14"

[package.metadata.porting]
go-package = "pkg/util/cpu"
legacy-tasks = ["task-292", "task-324"]
