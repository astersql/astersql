[package]
name = "astersql-util-tiflashcompute"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
config = { package = "astersql-config", path = "../../config" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
