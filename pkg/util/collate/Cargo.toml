[package]
name = "astersql-util-collate"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[features]
default = ["full_collate"]
full_collate = []

[dependencies]
dbterror = { package = "astersql-util-dbterror", path = "../dbterror" }
encoding_rs = "0.8.35"
parser_charset = { package = "astersql-parser-charset", path = "../../parser/charset" }

[dev-dependencies]
rand = "0.9"
testsetup = { package = "astersql-testkit-testsetup", path = "../../testkit/testsetup" }

[package.metadata.porting]
go-package = "pkg/util/collate"
legacy-tasks = ["task-303", "task-324"]
