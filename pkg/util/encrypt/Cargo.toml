[package]
name = "astersql-util-encrypt"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
aes = "0.8"
cbc = "0.1"
cfb-mode = "0.8"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
ctr = "0.9"
ofb = "0.6"
rand = "0.8"

[dev-dependencies]
checksum = { package = "astersql-util-checksum", path = "../checksum" }

[package.metadata.porting]
go-package = "pkg/util/encrypt"
legacy-tasks = ["task-69"]
