[package]
name = "astersql-br-tests-br-key-locked"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/tests/br_key_locked"
legacy-tasks = []
kind = "binary"
lane = 2

[[bin]]
name = "astersql-br-tests-br-key-locked"
path = "bin_main.rs"

# arm64 darwin: no kv/domain/kvproto/grpcio.
# Local stubs for codec/PD/TiKV/HTTP boundaries.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
