[package]
name = "astersql-br-cmd-br"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/cmd/br"
legacy-tasks = []
kind = "binary"
lane = 1

[[bin]]
name = "astersql-br-cmd-br"
path = "bin_main.rs"

# arm64 darwin: no kv/domain/kvproto/grpcio.
# Prefer slim BR crates only; local traits/stubs for glue/PD/TiKV/CLI frameworks.
[dependencies]
astersql-br-pkg-task = { package = "astersql-br-pkg-task", path = "../../pkg/task" }
astersql-br-pkg-task-operator = { package = "astersql-br-pkg-task-operator", path = "../../pkg/task/operator" }
astersql-br-pkg-trace = { package = "astersql-br-pkg-trace", path = "../../pkg/trace" }
astersql-br-pkg-streamhelper-config = { package = "astersql-br-pkg-streamhelper-config", path = "../../pkg/streamhelper/config" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
