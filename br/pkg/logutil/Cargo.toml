[package]
name = "astersql-br-pkg-logutil"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/pkg/logutil"
legacy-tasks = []
kind = "library"
lane = 0

# Slimmed for darwin arm64: no kv/domain/kvproto/grpcio/util-redact.
# File/Region/SSTMeta/RewriteRule/KeyRange/redact use local stubs matching Go call shapes.
[dependencies]
"astersql-br-pkg-errors" = { package = "astersql-br-pkg-errors", path = "../errors" }
"astersql-errors" = { package = "astersql-errors", path = "../../../pkg/errors" }
"astersql-lightning-metric" = { package = "astersql-lightning-metric", path = "../../../pkg/lightning/metric" }
prometheus = "0.14"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
"astersql-br-pkg-errors" = { package = "astersql-br-pkg-errors", path = "../errors" }
