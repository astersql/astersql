[package]
name = "astersql-br-pkg-summary"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/pkg/summary"
legacy-tasks = []
kind = "library"
lane = 1

[dependencies]
"astersql-br-pkg-logutil" = { package = "astersql-br-pkg-logutil", path = "../logutil" }
"astersql-errors" = { package = "astersql-errors", path = "../../../pkg/errors" }
bytesize = "2"
tracing = "0.1"

[dev-dependencies]
"astersql-testkit-testsetup" = { package = "astersql-testkit-testsetup", path = "../../../pkg/testkit/testsetup" }
