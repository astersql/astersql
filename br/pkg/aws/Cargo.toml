[package]
name = "astersql-br-pkg-aws"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/pkg/aws"
legacy-tasks = []
kind = "library"
lane = 2

[dependencies]
aws-config = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-ec2 = "1"
aws-smithy-http-client = { version = "1", features = ["legacy-rustls-ring"] }
aws-types = "1"
hyper-rustls = { version = "0.24", default-features = false, features = ["http1", "http2", "tls12", "webpki-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
