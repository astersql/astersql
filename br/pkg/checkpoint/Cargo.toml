[package]
name = "astersql-br-pkg-checkpoint"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/pkg/checkpoint"
legacy-tasks = []
kind = "library"
lane = 1

[dependencies]
aes = "0.8"
ctr = "0.9"
crossbeam-channel = "0.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
