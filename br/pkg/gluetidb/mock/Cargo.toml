[package]
name = "astersql-br-pkg-gluetidb-mock"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/pkg/gluetidb/mock"
legacy-tasks = []
kind = "library"
lane = 0

# Slimmed for darwin arm64: no kv/domain/kvproto/grpcio.
# SessionAPI / RecordSet / InternalTxnBR are local stand-ins matching Go
# sessionapi + kv call shapes used by this mock package.
[dependencies]
"astersql-br-pkg-glue" = { package = "astersql-br-pkg-glue", path = "../../glue" }
"astersql-errors" = { package = "astersql-errors", path = "../../../../pkg/errors" }
