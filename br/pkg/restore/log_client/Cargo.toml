[package]
name = "astersql-br-pkg-restore-log-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/pkg/restore/log_client"
legacy-tasks = []
kind = "library"
lane = 0

# arm64 darwin: no kv/domain/kvproto/grpcio. Prefer slim path deps + local stubs.
[dependencies]
astersql-br-pkg-utils = { path = "../../utils" }
astersql-br-pkg-restore = { path = ".." }
astersql-br-pkg-checkpoint = { path = "../../checkpoint" }
astersql-br-pkg-restore-split = { package = "astersql-br-pkg-restore-split", path = "../split" }
astersql-br-pkg-restore-utils = { package = "astersql-br-pkg-restore-utils", path = "../utils" }
astersql-br-pkg-utils-iter = { package = "astersql-br-pkg-utils-iter", path = "../../utils/iter" }
astersql-errors = { package = "astersql-errors", path = "../../../../pkg/errors" }
hex = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
