[package]
name = "astersql-br-pkg-gluetikv"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/pkg/gluetikv"
legacy-tasks = []
kind = "library"
lane = 1

# Slimmed for arm64: avoid utils/summary/kv/store-driver/domain → kvproto/grpcio.
# Record/StartProgress/Open use local stand-ins matching Go call shapes; full
# TiKVDriver + summary wiring is deferred to grpc-healthy regression.
[dependencies]
"astersql-br-pkg-glue" = { package = "astersql-br-pkg-glue", path = "../glue" }
"astersql-br-pkg-version-build" = { package = "astersql-br-pkg-version-build", path = "../version/build" }
"astersql-config" = { package = "astersql-config", path = "../../../pkg/config" }
"astersql-errors" = { package = "astersql-errors", path = "../../../pkg/errors" }
