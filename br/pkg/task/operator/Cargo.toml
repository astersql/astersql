[package]
name = "astersql-br-pkg-task-operator"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/pkg/task/operator"
legacy-tasks = []
kind = "library"
lane = 0

# arm64 darwin: no kv/domain/kvproto/grpcio. Local traits/stubs only.
[dependencies]
astersql-objstore = { package = "astersql-objstore", path = "../../../../pkg/objstore" }
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
