[package]
name = "astersql-br-pkg-backup"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/pkg/backup"
legacy-tasks = []
kind = "library"
lane = 0

# arm64: no kv/domain/kvproto/grpcio/distsql heavy deps. Local traits/stubs only.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
