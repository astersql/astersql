[package]
name = "astersql-br-pkg-streamhelper-daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/pkg/streamhelper/daemon"
legacy-tasks = []
kind = "library"
lane = 2

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
