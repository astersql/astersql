[package]
name = "astersql-br-pkg-conn-util"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "br/pkg/conn/util"
legacy-tasks = []
kind = "library"
lane = 2

# Slimmed for darwin arm64: no kvproto/grpcio. Store uses local stubs;
# utils/logutil/engine peers stay slim.
[dependencies]
"astersql-br-pkg-errors" = { package = "astersql-br-pkg-errors", path = "../../errors" }
"astersql-br-pkg-logutil" = { package = "astersql-br-pkg-logutil", path = "../../logutil" }
"astersql-br-pkg-utils" = { package = "astersql-br-pkg-utils", path = "../../utils" }
"astersql-util-engine" = { package = "astersql-util-engine", path = "../../../../pkg/util/engine" }
"astersql-errors" = { package = "astersql-errors", path = "../../../../pkg/errors" }
tracing = "0.1"
