[package]
name = "astersql-cmd-benchraw"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "cmd/benchraw"
legacy-tasks = []
kind = "binary"
lane = 1

[[bin]]
name = "astersql-cmd-benchraw"
path = "bin_main.rs"

[dependencies]
log = "0.4"
pprof = { version = "0.15", features = ["prost-codec"] }
tikv-client = { version = "=0.4.2", git = "ssh://git@github.com/astersql/client-rust.git", tag = "v0.4.2-aster.10", default-features = false }
tiny_http = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }
