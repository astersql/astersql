[package]
name = "astersql-cmd-benchkv"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "cmd/benchkv"
legacy-tasks = []
kind = "binary"
lane = 2

[[bin]]
name = "astersql-cmd-benchkv"
path = "bin_main.rs"

[dependencies]
astersql-kv = { path = "../../pkg/kv" }
astersql-store-driver = { path = "../../pkg/store/driver" }
prometheus = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
tiny_http = "0.12"
