[package]
name = "astersql-cmd-mirror"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "cmd/mirror"
legacy-tasks = []
kind = "binary"
lane = 2

[[bin]]
name = "astersql-cmd-mirror"
path = "bin_main.rs"

# arm64 darwin: no kv/domain/kvproto/grpcio.
# Prefer no heavy TiDB crates; local stubs cover bazel/exec/HTTP/git/file/network boundaries.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
