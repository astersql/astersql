[package]
name = "astersql-cmd-importer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "cmd/importer"
legacy-tasks = []
kind = "binary"
lane = 2

[[bin]]
name = "astersql-cmd-importer"
path = "bin_main.rs"

# arm64 darwin: no kv/domain/kvproto/grpcio.
# Prefer no heavy TiDB crates; local stubs cover SQL/DB/parser/stats/flags/logging.
[dependencies]
toml = "0.8"
serde_json = "1"
