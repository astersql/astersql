[package]
name = "astersql-tests-realtikvtest-addindextest2"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "tests/realtikvtest/addindextest2"
legacy-tasks = []
kind = "test-only"
lane = 0

[[test]]
name = "alter_job_test"
path = "alter_job_test.rs"

[[test]]
name = "global_sort_test"
path = "global_sort_test.rs"

[[test]]
name = "main_test"
path = "main_test.rs"

# arm64 darwin: no kv/domain/kvproto/grpcio.
# RealTiKV / SQL / failpoint / fake-GCS boundaries are local slim stubs in
# `astersql-tests-realtikvtest` (+ testutils). Do not pull heavy deps.
[dependencies]
"astersql-tests-realtikvtest" = { package = "astersql-tests-realtikvtest", path = ".." }
"astersql-tests-realtikvtest-testutils" = { package = "astersql-tests-realtikvtest-testutils", path = "../testutils" }
