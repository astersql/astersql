[package]
name = "astersql-tests-realtikvtest-pessimistictest"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "tests/realtikvtest/pessimistictest"
legacy-tasks = []
kind = "test-only"
lane = 2

[[test]]
name = "main_test"
path = "main_test.rs"

[[test]]
name = "pessimistic_test"
path = "pessimistic_test.rs"

[[test]]
name = "pessimistic_parity_test"
path = "pessimistic_parity_test.rs"

