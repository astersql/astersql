[package]
name = "astersql-tests-realtikvtest-brietest"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "tests/realtikvtest/brietest"
legacy-tasks = []
kind = "test-only"
lane = 1

[[test]]
name = "backup_restore_test"
path = "backup_restore_test.rs"

[[test]]
name = "binlog_test"
path = "binlog_test.rs"

[[test]]
name = "brie_test"
path = "brie_test.rs"

[[test]]
name = "gc_keyspace_test"
path = "gc_keyspace_test.rs"

[[test]]
name = "main_test"
path = "main_test.rs"

[[test]]
name = "operator_test"
path = "operator_test.rs"

[[test]]
name = "pitr_test"
path = "pitr_test.rs"

[[test]]
name = "registry_test"
path = "registry_test.rs"

[[test]]
name = "scheduler_test"
path = "scheduler_test.rs"

# Legacy scenarios use harness; the keyspace GC regression uses production
# SQL/GC/backup code and real PD/TiKV transports.
[dependencies]
"astersql-tests-realtikvtest" = { package = "astersql-tests-realtikvtest", path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

astersql-br-pkg-gc = { path = "../../../br/pkg/gc" }
astersql-br-pkg-task = { path = "../../../br/pkg/task" }
prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
astersql-session = { path = "../../../pkg/session" }
astersql-domain = { path = "../../../pkg/domain" }
astersql-store-driver = { path = "../../../pkg/store/driver" }
