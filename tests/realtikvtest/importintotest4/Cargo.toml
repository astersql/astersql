[package]
name = "astersql-tests-realtikvtest-importintotest4"
version.workspace = true
edition.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "tests/realtikvtest/importintotest4"
legacy-tasks = []
kind = "test-only"
lane = 1

[[test]]
name = "cloud_sdk_test"
path = "cloud_sdk_test.rs"

[[test]]
name = "conflict_resolution_test"
path = "conflict_resolution_test.rs"

[[test]]
name = "global_sort_test"
path = "global_sort_test.rs"

[[test]]
name = "import_summary_test"
path = "import_summary_test.rs"

[[test]]
name = "main_test"
path = "main_test.rs"

[[test]]
name = "manual_recovery_test"
path = "manual_recovery_test.rs"

[[test]]
name = "split_file_test"
path = "split_file_test.rs"

