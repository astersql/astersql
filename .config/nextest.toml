[profile.default]
# Run independent tests across all available logical CPUs. Individual tests that
# need serialization must continue to provide their own synchronization.
test-threads = "num-cpus"
fail-fast = false

# Report a test as slow after five seconds and terminate it after ten seconds.
# Keep this uniform across the workspace so expensive tests remain visible and
# can be optimized instead of receiving permanent exemptions.
slow-timeout = { period = "5s", terminate-after = 2, grace-period = "1s" }

# Scan-adapter runtime tests own real mock-KV Domains, background services, and
# lock-wait runtimes. Each case completes within ten seconds in isolation, but
# running the module concurrently exhausts those resources and makes the
# timeout move between otherwise healthy cases. Serialize only this module,
# leaving the rest of the workspace at the default CPU concurrency.
[test-groups.scan-adapter-runtime]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(scan_adapter_runtime_test)'
test-group = "scan-adapter-runtime"

# RealTiKV tests share one external cluster and its canonical bootstrap/catalog
# keys. Running separate packages concurrently can produce real optimistic
# write conflicts between otherwise independent cases, so serialize only this
# external-service test surface.
[test-groups.realtikv]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(/^astersql-tests-realtikvtest-/)'
test-group = "realtikv"
# Isolated measurements are 0.1–7.8s, while transient host contention can
# push a real Domain shutdown just past 10s. Keep the 5s slow signal but allow
# this scoped module up to 20s; the diagnostic profile remains the 60s backstop.
slow-timeout = { period = "5s", terminate-after = 4, grace-period = "1s" }

# These RealTiKV cases perform deliberate DDL propagation, retry, paging, or
# process-lifecycle waits. Serial diagnostic runs complete in 10.7–58.4s, so
# give only these proven slow tests enough time while retaining slow reports.
[[profile.default.overrides]]
filter = '''
test(=test_add_foreign_key_with_auto_create_index) |
test(=test_create_primary_key) |
test(=test_concurrent_ddl_create_gen_col_index) |
test(=test_concurrent_ddl_create_multi_cols_index) |
test(=test_concurrent_ddl_create_non_unique_index) |
test(=test_concurrent_ddl_create_primary_key) |
test(=test_concurrent_ddl_create_unique_index) |
test(=test_multi_schema_change_create_gen_col_index) |
test(=test_add_index_on_system_table) |
test(=test_cross_ks_info_schema_sync) |
test(=test_ingest_mv_index_on_partition_table) |
test(=test_add_index_resumes_from_checkpoint_after_partial_import) |
test(=test_add_index_resumes_from_checkpoint_after_partial_scan) |
test(=test_merge_temp_index_basic) |
test(=test_merge_temp_index_stuck) |
test(=test_split_file) |
test(=TestStaleReadAllCombinations) |
test(=test_paging_act_rows_and_process_keys) |
test(=parity_test::compatibility_public_start_stop_methods_execute) |
test(=parity_test::go_rust_public_contract_matches)
'''
slow-timeout = { period = "30s", terminate-after = 3, grace-period = "1s" }

# These planner suites build full mock domains, load statistics, and exercise
# complete optimizer fixtures. Serial diagnostic runs prove they complete in
# 4.5–34s while preserving their plan assertions, so scope the larger budget to
# these five packages instead of weakening the workspace-wide 10s limit.
[[profile.default.overrides]]
filter = '''
package(astersql-planner-core-casetest-cbotest) |
package(astersql-planner-core-casetest-tpch) |
package(astersql-planner-core-casetest-vectorsearch) |
package(astersql-planner-core-tests-cte) |
package(astersql-planner-core-tests-pointget)
'''
slow-timeout = { period = "30s", terminate-after = 2, grace-period = "1s" }

# Use this profile only for serial diagnosis of tests that hit the default
# timeout. It inherits all other settings from the default profile and gives a
# test up to 60 seconds to distinguish a slow test from a persistent wait.
[profile.diagnostic]
test-threads = 1
slow-timeout = { period = "30s", terminate-after = 2, grace-period = "1s" }
