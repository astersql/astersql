[package]
name = "astersql-lightning-pkg-progress"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "lightning/pkg/progress"
legacy-tasks = []
kind = "library"
lane = 2

# arm64 darwin: no kv/domain/kvproto/grpcio.
# Prefer already-ported checkpoints; local stubs cover common/mydump/errors.
[dependencies]
"astersql-lightning-pkg-checkpoints" = { package = "astersql-lightning-pkg-checkpoints", path = "../checkpoints" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
