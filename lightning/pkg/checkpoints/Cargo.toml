[package]
name = "astersql-lightning-pkg-checkpoints"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[package.metadata.porting]
go-package = "lightning/pkg/checkpoints"
legacy-tasks = []
kind = "library"
lane = 1

# arm64 darwin: no kv/domain/kvproto/grpcio.
# Prefer already-ported checkpointspb; local stubs cover MySQL/storage/file/DB/config boundaries.
[dependencies]
"astersql-lightning-pkg-checkpoints-checkpointspb" = { package = "astersql-lightning-pkg-checkpoints-checkpointspb", path = "checkpointspb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
